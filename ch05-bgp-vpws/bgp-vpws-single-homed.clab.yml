# =============================================================================
# Lab: BGP Signalling for VPWS
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 5 - BGP Signalling for VPWS
# =============================================================================
# This lab demonstrates:
# - Single-homed VPWS with BGP signalling
# =============================================================================
#
# Topology (Figure 5-2 from book):
#                                          
#     CE1 --------- R1                          
#      |         192.0.2.1                   
#      |                 \                               
#      |                  \     RR1                 
#      |                    192.0.2.10 --------- R3 --------- CE3
#      |                  /  AS 64496         192.0.2.3            
#      |                 /                          
#     CE4 --------- R4                        
#                 192.0.2.4                 
#                                             
#
# epipe "seven": CE1 <-> CE3 (single-homed)
# =============================================================================

name: ch05-bgp-vpws

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt

  nodes:
    R1:
      kind: nokia_srsim
      startup-config: configs/01/R1.partial.cfg
      
    R3:
      kind: nokia_srsim
      startup-config: configs/01/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/01/R4.partial.cfg
      
    RR1:
      kind: nokia_srsim
      startup-config: configs/01/RR1.partial.cfg
      
    CE1:
      kind: nokia_srsim
      startup-config: configs/01/CE1.partial.cfg
      
    CE3:
      kind: nokia_srsim
      startup-config: configs/01/CE3.partial.cfg
      
    CE4:
      kind: nokia_srsim
      startup-config: configs/01/CE4.partial.cfg

  links:
    # Core mesh
    - endpoints: ["R1:1/1/c1/1", "RR1:1/1/c1/1"]
    - endpoints: ["R4:1/1/c1/1", "RR1:1/1/c2/1"]
    - endpoints: ["R3:1/1/c1/1", "RR1:1/1/c3/1"]
    
    # Multi-homed CE1 and CE4
    - endpoints: ["CE1:1/1/c1/1", "R1:1/1/c3/1"]
    - endpoints: ["CE4:1/1/c1/1", "R4:1/1/c3/1"]
    - endpoints: ["CE1:1/1/c2/1", "CE4:1/1/c2/1"]

    # Single-homed CE3
    - endpoints: ["CE3:1/1/c1/1", "R3:1/1/c3/1"]
