# =============================================================================
# Lab: EVPN IP Prefix (Route-Type 5) - Interface-ful with SBD IRB model
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 6 - Ethernet VPN (continued)
# =============================================================================
# This lab demonstrates:
# - EVPN Route-Type 5 (IP Prefix Advertisement)
# - Interface-ful with SBD IRB model
# - EVPN + VXLAN overlay within each Data Centre
# - SR-MPLS underlay between Data Centres (IS-IS Level 2)
# - VPN-IPv4/IPv6 and EVPN address families via IBGP RR
# - IPv4 EBGP between NVEs and VAs (PE-CE)
# =============================================================================
#
# Topology (Figure 6-25 from book):
#
#                                    R1                R3     
#   ..............................192.0.2.1         192.0.2.3............................
#   : Data Centre 1               /    : \          /  : \                Data Centre 2 :
#   :                            /     :  \        /   :  \                             :
#   :                           /      :   \      /    :   \                            :
#   :                          /       :    \    /     :    \                           :
#   :      AS 65501           /        :     \  /      :     \           AS 65502       :
#   :      +------+          /         :      RR1      :      \          +------+       :
#   : VA1--| NVE1 |------  VPLS        :  192.0.2.10   :     VPLS -------| NVE2 |--VA2  :
#   :      +------+    192.168.1.0/24  :    /     \    :192.168.2.0/24   +------+       :
#   :                          \       :   /       \   :    /                           :
#   : 172.16.1.0/24             \      :  /         \  :   /               172.16.2.0/24:
#   :                            \     : / AS 64496  \ :  /                             :
#   :                             \     /             \  /                              :
#   :..............................  R4                R6 ...............................       
#                                192.0.2.4         192.0.2.6
#
# 
#          <-- IPv4 EBGP -->       <-- IS-IS Level 2 -->       <-- IPv4 EBGP -->
#          <--    EVPN   -->       <-- VPN-IPv4/IPv6 -->       <--    EVPN   -->
#          <--   VXLAN   -->       <--    SR-MPLS    -->       <--   VXLAN   -->
#
# =============================================================================

name: ch06-evpn-rt5-ipprefix-iff

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt

  nodes:
    R1:
      kind: nokia_srsim
      startup-config: configs/R1.partial.cfg
      
    R3:
      kind: nokia_srsim
      startup-config: configs/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/R4.partial.cfg
      
    R6:
      kind: nokia_srsim
      startup-config: configs/R6.partial.cfg
      
    Leaf3:
      kind: nokia_srsim
      startup-config: configs/Leaf3.partial.cfg
      
    Leaf4:
      kind: nokia_srsim
      startup-config: configs/Leaf4.partial.cfg
      
    # Hosts (different subnets)
    Host1:
      kind: linux
      
    Host2:
      kind: linux
      
    Host3:
      kind: linux
      
    Host4:
      kind: linux

  links:
    # Spine-Leaf fabric
    - endpoints: ["Spine1:1/1/1", "Leaf1:1/1/1"]
    - endpoints: ["Spine1:1/1/2", "Leaf2:1/1/1"]
    - endpoints: ["Spine1:1/1/3", "Leaf3:1/1/1"]
    - endpoints: ["Spine1:1/1/4", "Leaf4:1/1/1"]
    - endpoints: ["Spine2:1/1/1", "Leaf1:1/1/2"]
    - endpoints: ["Spine2:1/1/2", "Leaf2:1/1/2"]
    - endpoints: ["Spine2:1/1/3", "Leaf3:1/1/2"]
    - endpoints: ["Spine2:1/1/4", "Leaf4:1/1/2"]
    
    # Host connections
    - endpoints: ["Host1:eth1", "Leaf1:1/1/3"]
    - endpoints: ["Host2:eth1", "Leaf2:1/1/3"]
    - endpoints: ["Host3:eth1", "Leaf3:1/1/3"]
    - endpoints: ["Host4:eth1", "Leaf4:1/1/3"]
