# =======================================================================================
# Lab: EVPN IP Prefix (Route-Type 5) - Interface-ful with unnumbered SBD IRB model
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 6 - Ethernet VPN
# =======================================================================================
# This lab demonstrates:
# - EVPN Route-Type 5 (IP Prefix Advertisement)
# - Interface-ful with unnumbered SBD IRB model
# - EVPN + VXLAN overlay within each Data Centre
# - SR-MPLS underlay between Data Centres (IS-IS Level 2)
# - VPN-IPv4 address families via IBGP RR
# - IPv4 EBGP underlay between NVEs and Rs
# =======================================================================================
#
# Topology (Figure 6-28 from book):
#
#                                    R1                R3     
#   ..............................192.0.2.1         192.0.2.3............................
#   : Data Centre 1               /    : \          /  : \                Data Centre 2 :
#   :                            /     :  \        /   :  \                             :
#   :                           /      :   \      /    :   \                            :
#   :                          /       :    \    /     :    \                           :
#   :      AS 65501           /        :     \  /      :     \           AS 65502       :
#   :      +------+          /         :      RR1      :      \          +------+       :
#   : VA1--| NVE1 |------  VPLS        :  192.0.2.10   :     VPLS -------| NVE2 |--VA2  :
#   :      +------+     unnumbered     :    /     \    :  unnumbered     +------+       :
#   :                          \       :   /       \   :    /                           :
#   : 172.16.1.0/24             \      :  /         \  :   /               172.16.2.0/24:
#   :                            \     : / AS 64496  \ :  /                             :
#   :                             \     /             \  /                              :
#   :..............................  R4                R6 ...............................       
#                                192.0.2.4         192.0.2.6
#
# 
#              <--- IPv4 EBGP --->    <- IS-IS Level 2 ->    <--- IPv4 EBGP --->
#              <---    EVPN   --->    <- VPN-IPv4/IPv6 ->    <---    EVPN   --->
#              <---   VXLAN   --->    <-    SR-MPLS    ->    <---   VXLAN   --->
#
# =======================================================================================

name: ch06-evpn-rt5-ipprefix-iff-unnumbered

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    R1:
      kind: nokia_srsim
      startup-config: configs/08/R1.partial.cfg
      
    R3:
      kind: nokia_srsim
      startup-config: configs/08/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/08/R4.partial.cfg
      
    R6:
      kind: nokia_srsim
      startup-config: configs/08/R6.partial.cfg

    RR1:
      kind: nokia_srsim
      startup-config: configs/08/RR1.partial.cfg

    NVE1:
      kind: nokia_srsim
      startup-config: configs/08/NVE1.partial.cfg
      
    NVE2:
      kind: nokia_srsim
      startup-config: configs/08/NVE2.partial.cfg
      
    # Hosts (different subnets)
    VA1:
      kind: linux
      exec:
        - ip address add 172.16.1.1/24 dev eth1
        - ip route add 172.16.2.0/24 via 172.16.1.254 dev eth1

    VA2:
      kind: linux
      exec:
        - ip address add 172.16.2.1/24 dev eth1
        - ip route add 172.16.1.0/24 via 172.16.2.254 dev eth1

  links:
    # DC connections
    - endpoints: ["NVE1:1/1/c1/1", "R1:1/1/c3/1"]
    - endpoints: ["NVE1:1/1/c2/1", "R4:1/1/c3/1"]
    - endpoints: ["NVE2:1/1/c1/1", "R3:1/1/c3/1"]
    - endpoints: ["NVE2:1/1/c2/1", "R6:1/1/c3/1"]

    # Core connections
    - endpoints: ["R1:1/1/c1/1", "RR1:1/1/c1/1"]
    - endpoints: ["R4:1/1/c1/1", "RR1:1/1/c2/1"]
    - endpoints: ["R3:1/1/c1/1", "RR1:1/1/c3/1"]
    - endpoints: ["R6:1/1/c1/1", "RR1:1/1/c4/1"]

    # Host connections
    - endpoints: ["VA1:eth1", "NVE1:1/1/c3/1"]
    - endpoints: ["VA2:eth1", "NVE2:1/1/c3/1"]
