# =========================================================================================
# Lab: EVPN ETREE
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 6 - Ethernet VPN
# =========================================================================================
# This lab demonstrates:
# - EVPN ETREE service
# =========================================================================================
#
# Topology (Figure 6-13 from book):
#                                          
#     CE1 ------------Leaf-- R1                        
# IP 172.31.100.1         192.0.2.1                
# MAC 52:54:00:bb:00:01        \                               
#                               \     RR1                 
#                                 192.0.2.10 ------------ R3 --Root----- CE3
#                               /  AS 64496            192.0.2.3      IP 172.31.100.3          
#                              /                                      MAC 52:54:00:bb:00:03      
#     CE4 ------------Leaf-- R4                        
# IP 172.31.100.4         192.0.2.4                  
# MAC 52:54:00:bb:00:04
#
#
# EVPN ETREE with Route Target: 64496:100
# =========================================================================================

name: ch06-evpn-vpls

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt

  nodes:
    R1:
      kind: nokia_srsim
      startup-config: configs/02/R1.partial.cfg
      
    R3:
      kind: nokia_srsim
      startup-config: configs/02/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/02/R4.partial.cfg
      
    RR1:
      kind: nokia_srsim
      startup-config: configs/02/RR1.partial.cfg
      
    CE1:
      kind: nokia_srsim
      startup-config: configs/02/CE1.partial.cfg
      
    CE3:
      kind: nokia_srsim
      startup-config: configs/02/CE3.partial.cfg
      
    CE4:
      kind: nokia_srsim
      startup-config: configs/02/CE4.partial.cfg

  links:
    # Core mesh
    - endpoints: ["R1:1/1/c1/1", "RR1:1/1/c1/1"]
    - endpoints: ["R4:1/1/c1/1", "RR1:1/1/c2/1"]
    - endpoints: ["R3:1/1/c1/1", "RR1:1/1/c3/1"]

    # Single-homed CEs
    - endpoints: ["CE1:1/1/c1/1", "R1:1/1/c3/1"]
    - endpoints: ["CE3:1/1/c1/1", "R3:1/1/c3/1"]
    - endpoints: ["CE4:1/1/c1/1", "R4:1/1/c3/1"]
