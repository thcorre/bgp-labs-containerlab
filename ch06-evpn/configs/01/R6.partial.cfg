# =============================================================================
# R6 Configuration - AS 64496 (Provider Edge Router)
# Chapter 6: Ethernet VPN - EVPN-VPLS
# =============================================================================

configure {
    system {
        name "R6"
        location "Lab - Chapter 6 - EVPN-VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-RR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-CE6"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type qinq
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    lag "lag-10" {
        admin-state enable
        mode access
        encap-type qinq
        port 1/1/c3/1 {
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.6
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.6
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-RR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.6.10.1
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14006
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                metric 100
                }
            }
        }
        
        # LDP for MPLS label distribution        
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-RR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }    
        }
        
        # BGP for L2-VPN route exchange
        bgp {
            admin-state enable
            rapid-update {
                evpn true
            }
            group "IBGP" {
                peer-as 64496
                family {
                    evpn true
                }
            }
            # Peer with Route Reflector (RR1)
            neighbor "192.0.2.10" {
                group "IBGP"
            }
        }
    }
    
    # ==========================================================================
    # VPN three Configuration (EVPN-VPLS)
    # ==========================================================================
    service {
        system {
            bgp {
                evpn {
                    route-distinguisher "192.0.2.6:0"
                    ethernet-segment "esi-1" {
                        admin-state enable
                        type virtual
                        esi 0x05000644960000060000
                        multi-homing-mode all-active
                        df-election {
                            es-activation-timer 0
                            service-carving-mode manual
                            manual {
                                evi 1 {
                                    end 99
                                }
                                preference {
                                    value 200
                                }
                            }
                        }
                        association {
                            lag "lag-10" {
                                virtual-ranges {
                                    qinq {
                                        s-tag 1 {
                                            end 999
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        vpls "three" {
            admin-state enable
            service-id 3
            customer "1"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            bgp 1 {
            }
            bgp-evpn {
                evi 3
                mac-duplication {
                    detect {
                        num-moves 4
                    }
                }
                mpls 1 {
                    admin-state enable
                    ecmp 2
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-isis true
                        }
                    }
                }
            }
            sap lag-10:3.3 {
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
