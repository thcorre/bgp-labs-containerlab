# =============================================================================
# CE3 Configuration
# Chapter 6: Ethernet - EVPN IP Prefix (Route-Type 5)
# =============================================================================

configure {
    system {
        name "CE3"
        location "Lab - Chapter 6 - EVPN-VPLS"

        ip {
            allow-qinq-network-interface true
        }
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-CEs-link1"
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            encap-type qinq
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-CEs-link2"
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            encap-type qinq
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 65502
        router-id 192.0.2.102
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.102
                    prefix-length 32
                }
            }
        }
        interface "link-to-R3" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 192.168.48.10
                    prefix-length 30
                }
            }
        }
        interface "link-to-R6" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 192.168.48.14
                    prefix-length 30
                }
            }
        }
    }

    # ==========================================================================
    # VPN twelve Configuration (EVPN-VPLS)
    # ==========================================================================
    service {
        vpls "twelve" {
            admin-state enable
            service-id 12
            customer "1"
            vxlan {
                instance 1 {
                    vni 12
                }
            }
            bgp 1 {
                route-target {
                    export "target:65501:12"
                    import "target:65501:12"
                }
            }
            bgp-evpn {
                evi 12
                vxlan 1 {
                    admin-state enable
                    vxlan-instance 1
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
