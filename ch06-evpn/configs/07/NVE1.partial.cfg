# ======================================================================================
# NVE1 Configuration
# Chapter 6: Ethernet - EVPN IP Prefix (Route-Type 5) - Interface-ful with SBD IRB model
# ======================================================================================

configure {
    system {
        name "NVE1"
        location "Lab - Chapter 6 - EVPN-VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-R1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-R4"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 65501
        router-id 192.0.2.101
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.101
                    prefix-length 32
                }
            }
        }
        interface "link-to-R1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 192.168.48.2
                    prefix-length 30
                }
            }
        }
        interface "link-to-R4" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 192.168.48.6
                    prefix-length 30
                }
            }
        }

        # BGP for EVPN route exchange
        bgp {
            admin-state enable
            rapid-update {
                evpn true
            }
            group "DC-Overlay" {
                peer-as 64496
                family {
                    evpn true
                }
                split-horizon
            }
            group "DC-Underlay" {
                peer-as 64496
                family {
                    ipv4 true
                }
                split-horizon
            }
            # Peer with R1 in the Underlay
            neighbor "192.168.48.1" {
                group "DC-Underlay"
            }
            # Peer with R1 in the Overlay
            neighbor "192.0.2.1" {
                group "DC-Overlay"
            }
            # Peer with R4 in the Underlay
            neighbor "192.168.48.5" {
                group "DC-Underlay"
            }
            # Peer with R4 in the Overlay
            neighbor "192.0.2.4" {
                group "DC-Overlay"
            }
        }
    }

    # ==========================================================================
    # VPN twelve Configuration (EVPN-VPLS)
    # ==========================================================================
    service {
        vpls "twelve" {
            admin-state enable
            service-id 12
            customer "1"
            vxlan {
                instance 1 {
                    vni 12
                }
            }
            bgp 1 {
                route-target {
                    export "target:65501:12"
                    import "target:65501:12"
                }
            }
            bgp-evpn {
                evi 12
                vxlan 1 {
                    admin-state enable
                    vxlan-instance 1
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
