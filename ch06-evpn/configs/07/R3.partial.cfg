# ======================================================================================
# R3 Configuration - AS 64496 (Provider Edge Router)
# Chapter 6: Ethernet - EVPN IP Prefix (Route-Type 5) - Interface-ful with SBD IRB model
# ======================================================================================

configure {
    system {
        name "R3"
        location "Lab - Chapter 6 - EVPN-VPLS"
    }

    policy-options {
        prefix-list "system-prefix" {
            prefix 192.0.2.3/32 type exact {
            }
        }
        policy-statement "export-to-AS65502" {
            entry 10 {
                from {
                    prefix-list ["system-prefix"]
                    protocol {
                        name [direct]
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
    }

    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }
    
    port 1/1/c1 {
        admin-state enable
        description "to-RR1"
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-NVE2"
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.3
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.3
                    prefix-length 32
                }
            }
        }
        interface "link-to-RR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.3.10.1
                    prefix-length 30
                }
            }
        }
        interface "link-to-NVE2" {
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 192.168.48.9
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14003
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                metric 100
                }
            }
        }
        
        # BGP for EVPN and VPN-IPv4 route exchange
        bgp {
            admin-state enable
            rapid-update {
                evpn true
            }
            group "IBGP-Core" {
                peer-as 64496
                family {
                    vpn-ipv4 true
                }
            }
            group "DC-Overlay" {
                peer-as 65502
                family {
                    evpn true
                }
                ebgp-default-reject-policy {
                    import false
                    export false
                }
                split-horizon
            }
            group "DC-Underlay" {
                peer-as 65502
                family {
                    ipv4 true
                }
                ebgp-default-reject-policy {
                    import false
                }
                split-horizon
                export {
                    policy ["export-to-AS65502"]
                }
            }
            # Peer with Route Reflector (RR1)
            neighbor "192.0.2.10" {
                group "IBGP-Core"
            }
            # Peer with NVE in the Underlay (NVE2)
            neighbor "192.168.48.10" {
                group "DC-Underlay"
            }
            # Peer with NVE in the Overlay (NVE2)
            neighbor "192.0.2.102" {
                group "DC-Overlay"
            }
        }
    }
    
    # ==========================================================================
    # VPN eleven Configuration (EVPN-VPRN)
    # ==========================================================================
    service {
        vprn "eleven" {
            admin-state enable
            service-id 11
            customer "1"
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64496:11"
                    domain-id "64496:11"
                    vrf-target {
                        import-community "target:64496:11"
                        export-community "target:64496:11"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-isis true
                        }
                    }
                }
            }
            interface "evi-twelve" {
                ipv4 {
                    primary {
                        address 192.168.2.1
                        prefix-length 24
                    }
                }
                vpls "twelve" {
                }
            }
        }
    # ==========================================================================
    # VPN twelve Configuration (EVPN-VPLS)
    # ==========================================================================
        vpls "twelve" {
            admin-state enable
            service-id 12
            customer "1"
            vxlan {
                instance 1 {
                    vni 12
                }
            }
            routed-vpls {
            }
            bgp 1 {
                route-target {
                    export "target:65502:12"
                    import "target:65502:12"
                }
            }
            bgp 2 {
                route-target {
                    export "target:64496:12"
                    import "target:64496:12"
                }
            }
            bgp-evpn {
                evi 12
                routes {
                    ip-prefix {
                        advertise true
                        domain-id "65502:12"
                    }
                }
                vxlan 1 {
                    admin-state enable
                    vxlan-instance 1
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
