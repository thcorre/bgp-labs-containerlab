# =============================================================================
# R4 Configuration - AS 64496 (Provider Edge Router)
# Chapter 6: Ethernet VPN - EVPN VPWS - Single-Homed CE
# =============================================================================

configure {
    system {
        name "R4"
        location "Lab - Chapter 6 - EVPN-VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-RR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-CE4"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.4
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.4
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-RR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.4.10.1
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14004
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }
        
        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-RR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP for L2-VPN route exchange
        bgp {
            admin-state enable
            rapid-update {
                evpn true
            }
            group "IBGP" {
                peer-as 64496
                family {
                    evpn true
                }
            }
            # Peer with Route Reflector (RR1)
            neighbor "192.0.2.10" {
                group "IBGP"
            }
        }
    }
    
    # ==========================================================================
    # VPN two Configuration (EVPN VPWS)
    # ==========================================================================
    service {
        epipe "two" {
            admin-state enable
            service-id 2
            customer "1"
            sap 1/1/c3/1:2 {
            }
            bgp-evpn {
                evi 2
                local-attachment-circuit "local-AC" {
                    eth-tag 2
                }
                remote-attachment-circuit "remote-AC" {
                    eth-tag 2
                }
                mpls 1 {
                    admin-state enable
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-isis true
                        }
                    }
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
