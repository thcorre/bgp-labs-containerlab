# =============================================================================
# CE6 Configuration
# Chapter 6: Ethernet VPN - FXC - Default Mode
# =============================================================================

configure {
    system {
        name "CE6"
        location "Lab - Chapter 6 - EVPN-VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c5 {
        admin-state enable
        description "to-R6"
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c5/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type qinq
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64512
        router-id 192.100.1.3
        interface "system" {
            ipv4 {
                primary {
                    address 192.100.1.3
                    prefix-length 32
                }
            }
        }
    }

    service {
        vprn "FXC-AC1" {
            admin-state enable
            description "VRF to CE4"
            service-id 48
            customer "1"
            interface "link-to-CE4" {
                sap 1/1/c5/1:176.801 {
                }
                ipv4 {
                    primary {
                        address 192.168.126.2
                        prefix-length 30
                    }
                }
            }
        }
        vprn "FXC-AC2" {
            admin-state enable
            description "VRF172 to CE4"
            service-id 172
            customer "1"
            interface "link-to-CE4" {
                sap 1/1/c5/1:176.100 {
                }
                ipv4 {
                    primary {
                        address 192.168.126.6
                        prefix-length 30
                    }
                }
            }
        }
        vprn "FXC-AC3" {
            admin-state enable
            description "VRF174 to CE4"
            service-id 174
            customer "1"
            interface "link-to-CE4" {
                sap 1/1/c5/1:176.200 {
                }
                ipv4 {
                    primary {
                        address 192.168.126.10
                        prefix-length 30
                    }
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}