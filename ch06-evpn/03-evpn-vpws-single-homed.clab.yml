# =============================================================================
# Lab: EVPN-VPWS Single-homed
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 6 - Ethernet VPN
# =============================================================================
# This lab demonstrates:
# - EVPN Route Type 1 (Ethernet Auto-Discovery)
# - EVPN VPWS Service
# - Single-homed CE
# =============================================================================
#
# Topology (Figure 6-19 from book):
#                                          
#                                              R3     
#                                           192.0.2.3      
#                                          /         \         
#                                         /           \   
#     CE4 ------------- R4 ---------- RR1         LAG     CE3
# IP 172.16.1.4   192.0.2.4     192.0.2.10          / / IP 172.16.1.3
#                                  AS 64496          / /           
#                                           \       / /                            
#                                              R6      
#                                           192.0.2.6      
# 
# Note: LAG not in use in this lab (only single link R6-CE3 is used).
#
# =============================================================================

name: ch06-evpn-vpws-single-homed

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt

  nodes:
    R3:
      kind: nokia_srsim
      startup-config: configs/03/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/03/R4.partial.cfg

    R6:
      kind: nokia_srsim
      startup-config: configs/03/R6.partial.cfg
      
    RR1:
      kind: nokia_srsim
      startup-config: configs/03/RR1.partial.cfg
      
    CE3:
      kind: nokia_srsim
      startup-config: configs/03/CE3.partial.cfg
      
    CE4:
      kind: nokia_srsim
      startup-config: configs/03/CE4.partial.cfg

  links:
    # Core
    - endpoints: ["R4:1/1/c1/1", "RR1:1/1/c2/1"]
    - endpoints: ["R3:1/1/c1/1", "RR1:1/1/c3/1"]
    - endpoints: ["R6:1/1/c1/1", "RR1:1/1/c4/1"]

    # Single-homed CE3
    - endpoints: ["CE3:1/1/c1/1", "R6:1/1/c3/1"]
    
    # Single-homed CE4
    - endpoints: ["CE4:1/1/c1/1", "R4:1/1/c3/1"]
