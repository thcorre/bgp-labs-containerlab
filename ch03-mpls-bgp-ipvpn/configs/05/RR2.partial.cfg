# =============================================================================
# RR2 Configuration - Route Reflector (AS 64497)
# Chapter 3: MPLS/BGP IP-VPNs - Multi-AS Backbones (Inter-AS)
# =============================================================================

configure {
    system {
        name "RR2"
        location "Lab - Chapter 3 - Core/RR"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }
    
    port 1/1/c1 {
        admin-state enable
        description "to-ASBR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-R6"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    
    router "Base" {
        autonomous-system 64497
        router-id 192.0.2.11
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.11
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-ASBR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 192.168.0.22
                    prefix-length 30
                }
            }
        }
        
        interface "link-to-R6" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 192.168.0.26
                    prefix-length 30
                }
            }
        }


        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            interface "system" {
                passive true
            }
            interface "link-to-ASBR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
            interface "link-to-R6" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }    
        
        # LDP for MPLS label distribution        
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-ASBR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
                interface "link-to-R6" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP Route Reflector
        bgp {
            admin-state enable         
            group "IBGP-Core" {
                peer-as 64497
                local-address 192.0.2.11
                cluster {
                    cluster-id 192.0.2.11
                }
                family {
                    vpn-ipv4 true
                }
            }
            
            # Route Reflector clients
            neighbor "192.0.2.5" {
                group "IBGP-Core"
                description "RR-Client-ASBR2"
            }
            neighbor "192.0.2.6" {
                group "IBGP-Core"
                description "RR-Client-R6"
            }
        }
    }
}
