# =============================================================================
# R1 Configuration - AS 64496
# Chapter 3: MPLS/BGP IP-VPNs - Multi-AS Backbones (Inter-AS)
# =============================================================================

configure {
    system {
        name "R1"
        location "Lab - Chapter 3 - L3VPN"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    policy-options {
        policy-statement "RFC8212-allow-ebgp" {
            default-action {
                action-type accept
            }
        }
        policy-statement "VPN-IPv4-to-EBGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                to {
                    protocol { 
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-ASBR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-RR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-CE1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.1
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.1
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-ASBR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 192.168.0.1
                    prefix-length 30
                }
            }
        }

        interface "link-to-RR1" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 192.168.0.5
                    prefix-length 30
                }
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            interface "system" {
                passive true
            }
            interface "link-to-ASBR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }

        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-ASBR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
                interface "link-to-RR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP for VPNv4 route exchange
        bgp {
            admin-state enable
            group "IBGP-Core" {
                peer-as 64496
                family {
                    vpn-ipv4 true
                }
            }
            # Peer with Route Reflector (RR1)
            neighbor "192.0.2.10" {
                group "IBGP-Core"
                authentication-key "YBQ16nn6BJxFCyqa7afxVcicuDJrwKet hash2"
            }
        }
    }
    
    # ==========================================================================
    # VPN one Configuration (VPRN)
    # ==========================================================================
    service {
        vprn "one" {
            admin-state enable
            service-id 1
            customer "1"
            autonomous-system 64496
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64496:1"
                    vrf-target {
                        import-community "target:64496:1"
                        export-community "target:64496:1"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                        }
                    }
                }
            }
            # BGP PE-CE
            bgp {
                min-route-advertisement 1
                group "CE-EBGP" {
                    as-override true
                    split-horizon true
                    send-communities {
                        extended false
                    }
                }
                neighbor "192.168.100.2" {
                    group "CE-EBGP"
                    authentication-key "YBQ16nn6BJxFCyqa7afxVZFRVph5O6Vk hash2"
                    peer-as 64512
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["RFC8212-allow-ebgp"]
                    }
                    export {
                        policy ["VPN-IPv4-to-EBGP"]
                    }
                }
            }
            interface "link-to-CE1" {
                ipv4 {
                    primary {
                        address 192.168.100.1
                        prefix-length 30
                    }
                }
                sap 1/1/c3/1:200 {
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
