# =============================================================================
# ASBR2 Configuration - AS 64496 (Core Router)
# Chapter 3: MPLS/BGP IP-VPNs - Multi-AS Backbones (Inter-AS)
# =============================================================================

configure {
    system {
        name "ASBR2"
        location "Lab - Chapter 3 - L3VPN"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    policy-options {
        community "from-AS64496" {
            member "target:64496:1" { }
        }
        community "to-AS64496" {
            member "target:64496:1" { }
        }
    policy-statement "ASBR-EXPORT" {
        entry 10 {
            from {
                community {
                    name "to-AS64496"
                }
            }
            action {
                action-type accept
            }
        }
        default-action {
            action-type reject
        }
    }
    policy-statement "ASBR-IMPORT" {
        entry 10 {
            from {
                community {
                    name "from-AS64496"
                }
            }
            action {
                action-type accept
            }
        }
        default-action {
            action-type reject
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-R6"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-RR2"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-ASBR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64497
        router-id 192.0.2.5
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.5
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-R6" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 192.168.1.2
                    prefix-length 30
                }
            }
        }
        interface "link-to-RR1" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 10.2.10.1
                    prefix-length 30
                }
            }
        }
        interface "link-to-ASBR2" {
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 192.168.0.13
                    prefix-length 30
                }
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            interface "system" {
                passive true
            }
            interface "link-to-R1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }        
        
        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-R1" {
                    ipv4 {
                        admin-state enable
                    }
                }
                interface "link-to-RR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        bgp {
            admin-state enable
            inter-as-vpn true
            next-hop-resolution {
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                ldp true
                            }
                        }
                    }
                }
            }     
            group "EBGP" {
                vpn-apply-export true
                vpn-apply-import true
                peer-as 64497
                family {
                    vpn-ipv4 true
                }
                import {
                    policy ["ASBR-IMPORT"]
                }
                export {
                    policy ["ASBR-EXPORT"]
                }
            }
            group "IBGP-Core" {
                peer-as 64496
                family {
                    vpn-ipv4 true
                }
            }
            neighbor "192.0.2.10" {
                group "IBGP-Core"
                description "IBGP to RR1"
            }
            neighbor "192.168.0.14" {
                group "EBGP"
                description "EBGP to ASBR2"
            }
        }
    }
}
