# =============================================================================
# AGN4 Configuration - Aggregation Domain 2
# Chapter 7: Labeled Unicast IPv4
# =============================================================================

configure {
    system {
        name "AGN4"
        location "Lab - Chapter 7 - Labeled Unicast IPv4"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    policy-options {
        policy-statement "RFC8212-allow-ebgp" {
            default-action {
                action-type accept
            }
        }
        policy-statement "VPN-IPv4/v6-to-EBGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                to {
                    protocol { 
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-ABR4"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-AGN3"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.4
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.4
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-ABR4" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.4.104.1
                    prefix-length 30
                }
            }
        }

        interface "link-to-AGN3" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 10.3.4.2
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - Aggregation Domain 2
        isis 3 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.3001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14004
                }
            }
            interface "link-to-ABR4" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
            interface "link-to-AGN3" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }

        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-ABR4" {
                    ipv4 {
                        admin-state enable
                    }
                }
                interface "link-to-AGN3" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP for VPNv4 route exchange
        bgp {
            admin-state enable
            group "Aggregation-Domain" {
                peer-as 64496
                local-address 192.0.2.4
                family {
                    label-ipv4 true
                    label-ipv6 true
                }
            }
            group "Core-Domain" {
                peer-as 64496
                local-address 192.0.2.4
                family {
                    vpn-ipv4 true
                    vpn-ipv6 true
                }
            }
            # Peer with ABR for labeled unicast routes exchange within Aggregation Domain 2
            neighbor "192.0.2.103" {
                group "Aggregation-Domain"
            }
            # Peer with Route Reflector (RR1) in Core Domain for VPN-IPv4/6 routes exchange across domains
            neighbor "192.0.2.10" {
                group "Core-Domain"
            }
        }
    }
}
