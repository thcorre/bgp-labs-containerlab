# =============================================================================
# AGN2 Configuration - Aggregation Domain 1
# Chapter 7: Labeled Unicast IPv4
# =============================================================================

configure {
    system {
        name "AGN2"
        location "Lab - Chapter 7 - Labeled Unicast IPv4"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    policy-options {
        policy-statement "RFC8212-allow-ebgp" {
            default-action {
                action-type accept
            }
        }
        policy-statement "VPN-IPv4/v6-to-EBGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                to {
                    protocol { 
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-ABR2"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c2 {
        admin-state enable
        description "to-AGN1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-CE2"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.2
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.2
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-ABR2" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.1.102.1
                    prefix-length 30
                }
            }
        }

        interface "link-to-AGN1" {
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 10.1.2.2
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - Aggregation Domain 1
        isis 1 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            all-l1isis 01:80:c2:01:02:01
            all-l2isis 01:80:c2:01:02:02
            iid-tlv-enable
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.1001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14002
                }
            }
            interface "link-to-ABR2" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
            interface "link-to-AGN1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }

        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-ABR2" {
                    ipv4 {
                        admin-state enable
                    }
                }
                interface "link-to-AGN1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP for VPNv4 route exchange
        bgp {
            admin-state enable
            group "Aggregation-Domain" {
                peer-as 64496
                local-address 192.0.2.2
                family {
                    label-ipv4 true
                    label-ipv6 true
                }
            }
            group "Core-Domain" {
                peer-as 64496
                local-address 192.0.2.2
                family {
                    vpn-ipv4 true
                    vpn-ipv6 true
                }
            }
            # Peer with ABR (ABR2) for labeled unicast routes exchange within Aggregation Domain 1
            neighbor "192.0.2.102" {
                group "Aggregation-Domain"
            }
            # Peer with Route Reflector (RR1) in Core Domain for VPN-IPv4/6 routes exchange across domains
            neighbor "192.0.2.10" {
                group "Core-Domain"
            }
        }
    }
    
    # ==========================================================================
    # VPN one Configuration (VPRN)
    # ==========================================================================
    service {
        vprn "one" {
            admin-state enable
            service-id 1
            customer "1"
            autonomous-system 64496
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64496:1"
                    vrf-target {
                        import-community "target:64496:1"
                        export-community "target:64496:1"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-isis true
                        }
                    }
                }
            }
            # BGP PE-CE
            bgp {
                min-route-advertisement 1
                group "CE-EBGP" {
                    as-override true
                    split-horizon true
                    send-communities {
                        extended false
                    }
                }
                neighbor "192.168.100.14" {
                    group "CE-EBGP"
                    peer-as 64512
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["RFC8212-allow-ebgp"]
                    }
                    export {
                        policy ["VPN-IPv4/v6-to-EBGP"]
                    }
                }
            }
            interface "link-to-CE2" {
                ipv4 {
                    primary {
                        address 192.168.100.13
                        prefix-length 30
                    }
                }
                sap 1/1/c3/1:200 {
                }
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
