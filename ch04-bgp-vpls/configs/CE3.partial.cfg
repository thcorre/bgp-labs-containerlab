# =============================================================================
# CE3 Configuration - AS 64512 (Customer Edge Router)
# Chapter 4: Using BGP in VPLS
# =============================================================================

configure {
    system {
        name "CE3"
        location "Lab - Chapter 4 - BGP VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-R3"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            encap-type dot1q
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64512
        router-id 192.100.1.3
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.100.1.3
                    prefix-length 32
                }
            }
        }
        interface "link-to-CEs" {
            port 1/1/c1/1:6
            ipv4 {
                primary {
                    address 192.168.1.3
                    prefix-length 30
                }
            }
        }
    }
}
