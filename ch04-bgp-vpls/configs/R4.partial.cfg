# =============================================================================
# R4 Configuration - AS 64496 (Provider Edge Router)
# Chapter 4: Using BGP in VPLS
# =============================================================================

configure {
    system {
        name "R4"
        location "Lab - Chapter 4 - BGP VPLS"
    }
    
    card 1 {
        card-type iom-1
        mda 1 {
            mda-type me6-100gb-qsfp28
        }
        mda 2 {
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        admin-state enable
        description "to-RR1"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    port 1/1/c3 {
        admin-state enable
        description "to-CE4"
        connector {
            breakout c1-100g
        }
    }

    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
            lldp {
                dest-mac nearest-bridge {
                    receive true
                    transmit true
                    tx-tlvs {
                        port-desc true
                        sys-name true
                        sys-desc true
                    }
                    tx-mgmt-address system {
                    }
                }
            }
        }
    }

    router "Base" {
        autonomous-system 64496
        router-id 192.0.2.4
        
        interface "system" {
            ipv4 {
                primary {
                    address 192.0.2.4
                    prefix-length 32
                }
            }
        }
        
        interface "link-to-RR1" {
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 10.4.10.2
                    prefix-length 30
                }
            }
        }

        mpls-labels {
            static-label-range 11968
            sr-labels {
                start 12000
                end 19999
            }
        }

        # IS-IS for IGP - required for IBGP next-hop reachability
        isis 0 {
            admin-state enable
            ipv4-routing true
            level-capability 2
            level 2 {
                wide-metrics-only true
            }
            advertise-router-capability as
            prefix-attributes-tlv true
            traffic-engineering true
            area-address [49.0001]
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            interface "system" {
                passive true
                ipv4-node-sid {
                    label 14004
                }
            }
            interface "link-to-RR1" {
                interface-type point-to-point
                level 2 {
                    metric 100
                }
            }
        }
        
        # LDP for MPLS label distribution
        ldp {
            admin-state enable
            interface-parameters {
                interface "link-to-RR1" {
                    ipv4 {
                        admin-state enable
                    }
                }
            }
        }
        
        # BGP for L2-VPN route exchange
        bgp {
            admin-state enable
            rapid-update {
                l2-vpn true
            }
            group "IBGP" {
                peer-as 64496
                family {
                    l2-vpn true
                }
            }
            # Peer with Route Reflector (RR1)
            neighbor "192.0.2.10" {
                group "IBGP"
            }
        }
    }
    
    # ==========================================================================
    # VPN six Configuration (VPLS)
    # ==========================================================================
    service {
        pw-template "1" {
            split-horizon-group {
                name "SHG"
            }
        }
        vpls "six" {
            admin-state enable
            service-id 6
            customer "1"
            bgp 1 {
                route-distinguisher "64496:66"
                route-target {
                    export "target:64496:6"
                    import "target:64496:6"
                }
                pw-template-binding "1" {
                }
            }
            bgp-ad {
                admin-state enable
                vpls-id "64496:6"
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 512
                ve {
                    name "R4"
                    id 14
                }
            }
            bgp-mh-site "DUAL-HOME" {
                id 6
                boot-timer 120
                activation-timer 30
                sap 1/1/c3/1:6
            }
            sap 1/1/c3/1:6 {
            }
        }
        customer "1" {
            customer-id 1
        }
    }
}
