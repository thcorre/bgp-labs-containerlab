# =============================================================================
# Lab: BGP VPLS
# Book: Versatile Routing and Services with BGP - Volume II
# Chapter: 4 - Using BGP in VPLS
# =============================================================================
# This lab demonstrates:
# - BGP Auto-Discovery with LDP Signalling
# - BGP Auto-Discovery and Signalling (RFC 4761)
# - VPLS Multi-Homing with BGP
# =============================================================================
#
# Topology (Figure 4-3 from book):
#                                          
#     CE1 --------- R1                     R3 --------- CE3     
#                192.0.2.1             192.0.2.3      
#                        \              /                  
#                         \     RR1    /              
#                           192.0.2.10 
#                         /  AS 64496   \                  
#                        /               \            
#     CE4 --------- R4                     R6 --------- CE6     
#                 192.0.2.4               192.0.2.6      
#                                             
#
# BGP VPLS with Route Target: 64496:100
# Multi-homed CEs for redundancy
# =============================================================================

name: ch04-bgp-vpls

topology:
  kinds:
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      type: sr-1
      license: /opt/nokia/sros/license.txt
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    R1:
      kind: nokia_srsim
      startup-config: configs/R1.partial.cfg
      
    R3:
      kind: nokia_srsim
      startup-config: configs/R3.partial.cfg
      
    R4:
      kind: nokia_srsim
      startup-config: configs/R4.partial.cfg

    R6:
      kind: nokia_srsim
      startup-config: configs/R6.partial.cfg
      
    RR1:
      kind: nokia_srsim
      startup-config: configs/RR1.partial.cfg
      
    CE1:
      kind: nokia_srsim
      startup-config: configs/CE1.partial.cfg
      
    CE3:
      kind: nokia_srsim
      startup-config: configs/CE3.partial.cfg
      
    CE4:
      kind: nokia_srsim
      startup-config: configs/CE4.partial.cfg
      
    CE6:
      kind: nokia_srsim
      startup-config: configs/CE6.partial.cfg

  links:
    # Core mesh
    - endpoints: ["R1:1/1/c1/1", "RR1:1/1/c1/1"]
    - endpoints: ["R4:1/1/c1/1", "RR1:1/1/c2/1"]
    - endpoints: ["R3:1/1/c1/1", "RR1:1/1/c3/1"]
    - endpoints: ["R6:1/1/c1/1", "RR1:1/1/c4/1"]
    
    # Multi-homed CE1 and CE4
    - endpoints: ["CE1:1/1/c1/1", "R1:1/1/c3/1"]
    - endpoints: ["CE4:1/1/c1/1", "R4:1/1/c3/1"]
    - endpoints: ["CE1:1/1/c2/1", "CE4:1/1/c2/1"]

    # Single-homed CE3
    - endpoints: ["CE3:1/1/c1/1", "R1:1/1/c3/1"]
    
    # Single-homed CE6
    - endpoints: ["CE6:1/1/c1/1", "R6:1/1/c3/1"]
